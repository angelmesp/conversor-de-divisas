<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>DivisApp 16003654</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Conversor de divisas</ion-card-title>
      <ion-card-subtitle>Tipo de cambio: Q8.00 = $1.00</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <ion-input
        type="number"
        label="Cantidad en quetzales (Q)"
        labelPlacement="floating"
        fill="outline"
        placeholder="0.00"
        [(ngModel)]="quetzales"
      ></ion-input>

      <ion-button expand="block" class="ion-margin-top" (click)="convertir()">
        Convertir
      </ion-button>
    </ion-card-content>
  </ion-card>

  @if (dolares !== null) {
    <ion-card color="light">
      <ion-card-content class="resultado">
        <p>Q {{ quetzalesConvertidos | number: '1.2-2' }} equivalen a</p>
        <h1>$ {{ dolares | number: '1.2-2' }}</h1>
      </ion-card-content>
    </ion-card>
  }
</ion-content>
